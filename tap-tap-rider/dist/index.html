<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#fffef9">
  <title>탭탭 라이더 · TAP TAP RIDER</title>
  <link rel="icon" href="assets/helmet.png?v=2">
  <link rel="preload" href="assets/jua.ttf?v=3" as="font" type="font/ttf" crossorigin>
  <link rel="preload" href="assets/suit.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="game.css?v=5">
  <script defer src="painted-art.js?v=6"></script>
  <script defer src="art.js?v=6"></script>
  <script defer src="visuals.js?v=4"></script>
  <script defer src="sound.js"></script>
  <script defer src="model.js?v=4"></script>
  <script defer src="streets.js?v=5"></script>
  <script defer src="game.js?v=5"></script>
</head>
<body>
<main id="game">
  <header class="topbar">
    <div class="brand"><img src="assets/helmet.png?v=2" alt=""><div><h1>탭탭 <span>라이더</span></h1><small>TAP TAP RIDER</small></div></div>
    <div class="clock-box"><b id="day">DAY 01</b><span id="clock">금요일 18:20</span><i></i><span id="weather"></span></div>
    <div class="balances"><span class="money"><i data-icon="coin"></i><b id="wallet">₩0</b></span><span class="rating"><i data-icon="star"></i><b id="rating">5.0</b></span><button class="icon-button gear" data-action="settings" aria-label="설정" title="설정"><i data-icon="settings"></i></button></div>
  </header>
  <section class="world" id="world" aria-label="배달 게임 화면">
    <div class="view" id="view"><div id="street-strip" class="street-strip" role="img" hidden></div><div id="shop-wall-sign" class="shop-wall-sign" hidden aria-hidden="true"><canvas id="shop-wall-emblem"></canvas><strong id="shop-wall-name"></strong></div></div><div class="light" id="light"></div><canvas id="particles" aria-hidden="true"></canvas>
    <div class="location"><i data-icon="pin"></i><div><small id="loc-code">DELIVERY ZONE</small><strong id="loc-name"></strong></div></div>
    <button class="minimap" data-action="map" aria-label="경로 지도 확대"><span class="map-heading"><span><i data-icon="map"></i> 미니맵</span><i data-icon="expand"></i></span><canvas id="map" width="528" height="246"></canvas></button>
    <div id="place-marker" class="place-marker"><i data-icon="store"></i><span id="marker-text">픽업</span></div>
    <div id="player" class="player"><span class="player-arrow"></span><div class="player-shadow"></div><canvas id="hero" width="90" height="74" aria-label="배달 라이더"></canvas></div>
    <button class="scene-mission" data-action="missions"><span class="mission-symbol"><i data-icon="flag"></i></span><span><small>오늘의 미션</small><strong id="quick-mission">빠른 배달 3회</strong></span><b id="quick-count">0/3</b></button>
    <span class="scene-note" id="scene-note" role="status"></span>
    <div class="wipe" id="wipe" aria-hidden="true"></div>
  </section>
  <section class="console" aria-label="배달 조작">
    <article class="panel order-panel" id="order-panel" aria-live="polite"></article>
    <article class="panel condition"><div class="panel-heading"><span><i data-icon="pulse"></i>라이더 상태</span><b id="ride-type" class="small-tag">도보</b></div>
      <div class="fatigue-label"><span><i data-icon="battery"></i> 피로도</span><b id="fatigue-value">0<span>%</span></b></div>
      <div class="gauge" id="fatigue-gauge" role="meter" aria-label="피로도" aria-valuemin="0" aria-valuemax="100"><div id="heat-fill"></div></div>
      <div class="speed-label"><span>현재 속도</span><strong><b id="speed">0.0</b> <small>km/h</small></strong></div>
    </article>
    <button class="boost-panel" id="boost" data-action="boost" aria-disabled="true"><span class="bolt"><i data-icon="bolt"></i></span><strong>탭 부스트</strong><small id="boost-hint"><kbd>SPACE</kbd> 또는 탭</small></button>
  </section>
  <nav class="dock" aria-label="게임 메뉴">
    <div class="nav-items"><button class="active" data-action="home"><i data-icon="radio"></i>배달</button><button data-action="garage"><i data-icon="garage"></i>차고</button><button data-action="missions"><i data-icon="flag"></i>미션<span id="claim-dot" hidden></span></button><button data-action="history"><i data-icon="history"></i>배달 기록</button></div>
    <div class="utilities"><button data-action="mute" id="mute" title="전체 소리" aria-label="전체 소리"><i data-icon="volume"></i></button><button data-action="fullscreen" title="전체 화면" aria-label="전체 화면"><i data-icon="fullscreen"></i></button></div>
  </nav>
</main>
<dialog id="dialog"><section class="modal"><header><div><small id="modal-kicker"></small><h2 id="modal-title"></h2></div><button data-action="close" class="icon-button" aria-label="닫기"><i data-icon="x"></i></button></header><div id="modal-content"></div></section></dialog>
<noscript>게임을 플레이하려면 브라우저에서 자바스크립트를 켜 주세요.</noscript>
</body>
</html>
