name: Deploy TapTapRider to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out game source
        uses: actions/checkout@v7.0.1
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6.0.0
      - name: Upload game files
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: tap-tap-rider/dist
      - name: Deploy game
        id: deployment
        uses: actions/deploy-pages@v5.0.1
